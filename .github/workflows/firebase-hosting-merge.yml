name: Firebase Hosting Deploy (service account)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Configure Google service account key
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKYDASH_B112D }}
        run: |
          echo "$FIREBASE_SA_JSON" > "$GITHUB_WORKSPACE"/firebase_key.json
          chmod 600 "$GITHUB_WORKSPACE"/firebase_key.json
          echo "Wrote service account key to $GITHUB_WORKSPACE/firebase_key.json"

      - name: Set GOOGLE_APPLICATION_CREDENTIALS
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/firebase_key.json" >> $GITHUB_ENV

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: skydash-b112d
        run: |
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
